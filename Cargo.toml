[package]
name = "atpspy"
version = "0.1.0"
edition = "2024"
description = "A TUI tool to analyze, risk-score, and selectively upgrade APT packages"
license = "MIT"
repository = "https://github.com/Parashar-dev/ATPspy"
readme = "README.md"
keywords = ["apt", "tui", "linux", "package-manager", "ratatui"]
categories = ["command-line-utilities"]

[[bin]]
name = "atpspy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
crossterm = "0.29.0"
dotenvy = "0.15.7"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = {version = "1.52.1",features = ["full"]}
